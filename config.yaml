# CSP Scanner ayarları
# Kriterlerin kaynağı: pia-shadow reposundaki CSP2_SPEC_V1 (Barchart ayarların).
# Bir değeri değiştirmek için sadece sayıyı düzenle; kodu değiştirmene gerek yok.

# Taranacak hisseler (pia-shadow live-config.json içindeki ilk 40 sembol).
# Hisse eklemek/çıkarmak için listeyi düzenle. Her hisse günde yaklaşık 2-3 API kredisi harcar.
universe:
  - AAPL
  - MSFT
  - AMZN
  - GOOGL
  - META
  - NVDA
  - AMD
  - INTC
  - QCOM
  - AVGO
  - MU
  - TXN
  - AMAT
  - LRCX
  - KLAC
  - ADI
  - NXPI
  - ON
  - MRVL
  - ARM
  - CRWD
  - NOW
  - ANET
  - ADBE
  - CRM
  - ORCL
  - CSCO
  - IBM
  - HPQ
  - DELL
  - PLTR
  - PANW
  - FTNT
  - NET
  - DDOG
  - SNOW
  - SHOP
  - UBER
  - ABNB
  - PYPL

# Opsiyon kontratı filtreleri (put, haftalık + aylık vadeler dahil)
option:
  dte_min: 21              # vadeye en az 21 gün
  dte_max: 45              # vadeye en fazla 45 gün
  delta_min: -0.27         # delta -0.27 ile -0.15 arasında
  delta_max: -0.15
  open_interest_min: 300   # open interest >= 300
  option_volume_min: 25    # günlük opsiyon hacmi >= 25
  bid_gt: 0.75             # bid > 0.75
  spread_pct_lt: 10        # (ask - bid) / ask * 100 < 10

# Hisse (underlying) filtreleri
underlying:
  price_min: 20
  price_max: 300
  volume_gt: 1000000       # günlük hisse hacmi > 1 milyon (gün içi çalışırsa o ana kadarki hacim)
  daily_change_pct_min: -3 # günlük değişim -%3 ile +%3 arasında
  daily_change_pct_max: 3
  # market_cap_min (5 milyar $): MarketData bu bilgiyi vermiyor, bu yüzden uygulanmıyor.
  # Evren zaten önceden seçilmiş büyük şirketlerden oluşuyor.

# Earnings kuralı: bir sonraki earnings tarihi biliniyor olmalı ve vade ondan kesinlikle önce olmalı
earnings:
  require_known_date: true   # tarih bulunamazsa aday elenir (false yaparsan geçer)
  lookahead_days: 120        # earnings tarihi için bu kadar gün ileriye bakılır

# Getiri hesabı (spec'te formül "doğrulanmamış" işaretliydi; burada standart formül seçildi)
return:
  premium_basis: bid         # bid = temkinli, mid = ortası
  base: strike               # strike  -> prim / strike ;  strike_minus_premium -> prim / (strike - prim)
  annualized_gt_pct: 10      # yıllık getiri > %10   (getiri * 365 / DTE)

# IV rank / IV percentile
# MarketData bu iki değeri hazır vermiyor. Scanner her gün her hissenin IV değerini
# data/iv_history.csv dosyasına kaydeder ve zamanla kendi IV rank/percentile'ını hesaplar.
iv:
  rank_gt: 20
  percentile_gt: 30
  min_history_days: 30             # bu kadar günlük geçmiş birikmeden filtre uygulanamaz
  lookback_calendar_days: 365
  sample_delta_abs_min: 0.15       # IV örneği: bu delta bandındaki put'ların medyan IV'si
  sample_delta_abs_max: 0.35
  when_insufficient_history: pass  # pass = geçmiş yetersizken adayı "uyarıyla" listele ; reject = ele

# Mail çıktısı
output:
  top_n: 25            # mailde en fazla kaç aday
  max_per_symbol: 2    # aynı hisseden en fazla kaç kontrat

# MarketData veri modu (pia-shadow'da test edilen ayar)
marketdata:
  mode: cached
  maxage: 20min

safety:
  max_api_calls: 400
  skip_when_market_closed: true
