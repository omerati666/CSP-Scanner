  profit_take_pct: 50        # satılan primin %50'si kazanıldıysa "kapatmayı düşün" uyarısı
  near_strike_pct: 3         # hisse strike'a %3'ten yakınsa uyarı
  expiry_warn_days: 7        # vadeye 7 gün kala uyarı
