# CSP Scanner ayarları
# Kriterlerin kaynağı: pia-shadow reposundaki CSP2_SPEC_V1 (Barchart ayarların).
# Bir değeri değiştirmek için sadece sayıyı düzenle; kodu değiştirmene gerek yok.

# Taranacak hisseler (senin takip listen). Hisse eklemek/çıkarmak için listeyi düzenle.
# Her hisse günde yaklaşık 2-3 API kredisi harcar. Semboller tırnak içinde yazılır (ON, NO gibi
# semboller tırnaksız yazılırsa YAML bunları 'doğru/yanlış' sanır).
universe:
  - "AAPL"
  - "AMD"
  - "AMZN"
  - "APLD"
  - "ARM"
  - "ASML"
  - "AVGO"
  - "CME"
  - "CRDO"
  - "CRWD"
  - "CRWV"
  - "DAVE"
  - "DDOG"
  - "DIS"
  - "ERO"
  - "EWZ"
  - "FIX"
  - "FTNT"
  - "GLW"
  - "GOOGL"
  - "HCA"
  - "HIMS"
  - "INOD"
  - "INTC"
  - "ISRG"
  - "KMI"
  - "LITE"
  - "LRCX"
  - "MA"
  - "META"
  - "MRVL"
  - "MSFT"
  - "MU"
  - "NBIS"
  - "NFLX"
  - "NVDA"
  - "NVT"
  - "ONTO"
  - "ORCL"
  - "PANW"
  - "PLTR"
  - "RKLB"
  - "SHOP"
  - "SKHY"
  - "SNDK"
  - "SOFI"
  - "SOXL"
  - "SPCX"
  - "SPGI"
  - "TMO"
  - "TSLA"
  - "TSM"
  - "UNH"
