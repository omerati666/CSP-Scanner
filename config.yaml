# ETF listesi: bu semboller earnings kuralından MUAF (earnings sorgusu yapılmaz, uyarı çıkmaz,
# puanda earnings bileşeni hesaba katılmaz, raporda "ETF" yazar). Tırnak içinde yaz.
etf_symbols:
  - "EWZ"
  - "SOXL"

# Opsiyon kontratı filtreleri (put, haftalık + aylık vadeler dahil)
option:
  dte_min: 21              # vadeye en az 21 gün
  dte_max: 45              # vadeye en fazla 45 gün
  delta_min: -0.27         # delta -0.27 ile -0.15 arasında
  delta_max: -0.15
  open_interest_min: 300   # open interest >= 300
  option_volume_min: 25    # günlük opsiyon hacmi >= 25
  bid_gt: 0.50             # bid > 0.50
  spread_pct_lt: 10        # (ask - bid) / ask * 100 < 10

# Hisse (underlying) filtreleri
underlying:
  # Hisse fiyat sınırı KAPALI (taranacak listeyi sen belirliyorsun). Açmak istersen
  # use_price_limits: true yap; price_min / price_max değerleri o zaman geçerli olur.
  use_price_limits: false
  price_min: 20
  price_max: 300
  volume_gt: 1000000       # günlük hisse hacmi > 1 milyon (gün içi çalışırsa o ana kadarki hacim)
  # Günlük değişim filtresi KAPALI (-100 / 100 = fiilen sınırsız). Tekrar açmak için ör. -3 ve 3 yaz.
  daily_change_pct_min: -100
  daily_change_pct_max: 100
  # market_cap_min (5 milyar $): MarketData bu bilgiyi vermiyor, bu yüzden uygulanmıyor.

# Earnings kuralı
earnings:
  min_days_to_earnings: 30     # tarama tarihi ile sonraki earnings arası en az 30 gün
  expiry_before_earnings: false  # true yaparsan ayrıca vade earnings'ten ÖNCE olmalı
  when_date_unknown: warn      # warn = tarih bulunamazsa uyarıyla listele ; reject = ele
  lookahead_days: 180          # earnings tarihi için bu kadar gün ileriye bakılır
  lookback_days: 120           # tarihi bilinmeyen hisselerde "son açıklama" için geriye bakış (ek kredi harcamaz)

# Getiri hesabı (spec'te formül "doğrulanmamış" işaretliydi; burada standart formül seçildi)
return:
  premium_basis: bid         # bid = temkinli, mid = ortası
  base: strike               # strike  -> prim / strike ;  strike_minus_premium -> prim / (strike - prim)
  annualized_gt_pct: 10      # yıllık getiri > %10   (getiri * 365 / DTE)

# IV rank / IV percentile
# MarketData bu iki değeri hazır vermiyor. Scanner her gün her hissenin IV değerini
# data/iv_history.csv dosyasına kaydeder ve zamanla kendi IV rank/percentile'ını hesaplar.
iv:
  rank_gt: 20
  percentile_gt: 30
  min_history_days: 30             # bu kadar günlük geçmiş birikmeden filtre uygulanamaz
  lookback_calendar_days: 365
  sample_delta_abs_min: 0.15       # IV örneği: bu delta bandındaki put'ların medyan IV'si
  sample_delta_abs_max: 0.35
  when_insufficient_history: pass  # pass = geçmiş yetersizken adayı "uyarıyla" listele ; reject = ele

# Mail çıktısı
output:
  top_n: 25            # mailde en fazla kaç aday
  max_per_symbol: 2    # aynı hisseden en fazla kaç kontrat
  # "Yakın kaçanlar" bölümü (yalnızca tek bir filtreye takılan kontratlar)
  near_miss_per_reason: 4          # her filtre grubu için mailde en fazla kaç kontrat gösterilsin
  near_miss_max_per_symbol: 2      # bir grupta aynı hisseden en fazla kaç kontrat
  near_miss_delta_tolerance: 0.05  # delta bandının ne kadar dışındakiler "yakın" sayılsın
  sort_by: score       # score = puana göre sırala ; annualized = yıllık getiriye göre sırala

# MarketData veri modu (pia-shadow'da test edilen ayar)
marketdata:
  mode: cached
  maxage: 20min

safety:
  max_api_calls: 400
  skip_when_market_closed: true

# Puan (0-100): her adaya verilen sezgisel sıralama puanı. Ağırlıklı ortalamadır.
# Ağırlıkları değiştirerek neye önem verdiğini ayarlayabilirsin (0 yaparsan o bileşen devre dışı kalır).
# IV geçmişi birikmediyse "iv" bileşeni hesaba katılmaz ve kalan ağırlıklar yeniden ölçeklenir.
score:
  weights:
    return: 30      # yıllık getiri
    safety: 30      # düşük |delta| (daha düşük delta = daha güvenli)
    liquidity: 20   # dar bid-ask spread + yüksek open interest
    earnings: 10    # earnings tarihi biliniyor ve vade ondan önce
    iv: 10          # IV rank (yeterli geçmiş birikince)
  return_zero_at: 10   # bu yıllık getiride (%) 0 puan
  return_full_at: 30   # bu yıllık getiri ve üstünde 100 puan
  delta_zero_at: 0.30  # |delta| bu değerde 0 puan
  delta_full_at: 0.10  # |delta| bu değer ve altında 100 puan
  spread_zero_at: 10   # spread (%) bu değerde 0 puan
  spread_full_at: 1    # spread (%) bu değer ve altında 100 puan
  oi_zero_at: 300      # open interest bu değerde 0 puan
  oi_full_at: 3000     # open interest bu değer ve üstünde 100 puan
  ivr_zero_at: 20      # IV rank bu değerde 0 puan
  ivr_full_at: 80      # IV rank bu değer ve üstünde 100 puan
  earnings_known: 100    # earnings tarihi biliniyor ve vade ondan önce
  earnings_spans: 30     # vade earnings'i kapsıyor
  earnings_unknown: 40   # earnings tarihi bilinmiyor
  # Puan tavanları: bu durumlarda puan, hesaplanan değer ne olursa olsun bu sayıyı geçemez.
  iv_cap_above_pct: 100  # IV % bunun üstündeyse (ör. SOXL, BE) ...
  iv_cap_score: 70       # ... puan en fazla 70 olur. Kapatmak için iv_cap_above_pct: 0 yaz.
  spans_cap_score: 70    # vade earnings'i kapsıyorsa puan en fazla 70 olur (kapatmak için 100 yaz)

# HV (tarihsel volatilite): raporda IV/HV oranı için. Yalnızca raporda gösterilen hisseler için çekilir
# (1000 günlük mum = 1 API kredisi, yani maliyeti ihmal edilebilir).
hv:
  enabled: true
  days: 20               # kaç günlük HV

# Naked put (assignment) bütçen. Rapor her satırda teminatın bütçenin yüzde kaçı olduğunu gösterir,
# bütçeyi aşanları işaretler (elemez) ve puana göre örnek bir sepet önerir.
exposure:
  limit_usd: 60000        # toplam izin verilen assignment exposure (strike x 100 toplamı)
  used_usd: 0             # ekstra elle eklenecek tutar (positions.yaml'daki açık putlar otomatik eklenir; normalde 0 bırak)
  basket_max_per_group: 2 # örnek sepette aynı gruptan en fazla kaç hisse

